name: Publish Docs Articles To Wiki

on:
  schedule:
    # Sunday 21:30 UTC = Monday 01:00 Iran
    - cron: "30 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Wiki (with auth)
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/intellsoft/timelapse-multi-camera.wiki.git wiki

      - name: Fetch source page
        run: |
          curl -L https://intellsoft.ir/docs/cctv-camera-timelapse-software-guide/ -o index.html

      - name: Extract nav-link articles
        run: |
          mkdir -p articles

          # استخراج href و متن لینک‌هایی با class="nav-link"
          grep -oP '<a[^>]*class="nav-link"[^>]*href="\K[^"]+' index.html > links.txt
          grep -oP '<a[^>]*class="nav-link"[^>]*>\\K[^<]+' index.html > titles.txt

          paste links.txt titles.txt > articles/list.txt

      - name: Publish new articles to Wiki
        run: |
          while IFS=$'\t' read -r url title; do
            slug=$(basename "$url")
            file="wiki/$slug.md"

            if [ -f "$file" ]; then
              echo "Already exists: $title"
              continue
            fi

            echo "Publishing: $title"

            curl -L "$url" -o article.html

            # استخراج متن مقاله (بین <article> تا </article>)
            sed -n '/<article/,/<\/article>/p' article.html \
              | sed 's/<[^>]*>//g' > body.txt

            {
              echo "# $title"
              echo ""
              cat body.txt
              echo ""
              echo "---"
              echo "🔗 **منبع اصلی مقاله:**"
              echo ""
              echo "👉 [$url]($url?utm_source=github_wiki&utm_medium=wiki&utm_campaign=timelapse_docs)"
            } > "$file"

          done < articles/list.txt

      - name: Commit and push to Wiki
        run: |
          cd wiki
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto publish new documentation articles to Wiki" || exit 0
          git push
